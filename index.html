<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0c1d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Randomizer">
<meta name="description" content="Roll to decide who goes first.">
<title>The Randomizer</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0c1d;
    --card: rgba(255,255,255,.06);
    --card-hi: rgba(255,255,255,.1);
    --line: rgba(255,255,255,.12);
    --text: #f4f2ff;
    --muted: #a59fc4;
    --a1: #7c5cff;
    --a2: #22d3ee;
    --gold: #ffcc4d;
    --H: 56px; /* wheel item height */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; }
  body {
    background: radial-gradient(120% 70% at 50% -10%, #2c1f63 0%, var(--bg) 62%) var(--bg);
    color: var(--text);
    font-family: Outfit, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  #app { position: relative; height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; overflow: hidden; }

  /* ---------- screens ---------- */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 18px);
    opacity: 0; transform: translateX(28px); pointer-events: none;
    transition: opacity .32s ease, transform .32s cubic-bezier(.2,.8,.2,1);
  }
  .screen.active { opacity: 1; transform: none; pointer-events: auto; }
  .screen.left { transform: translateX(-28px); }

  .top { display: flex; align-items: center; gap: 10px; height: 44px; flex: none; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--card); display: grid; place-items: center; flex: none;
  }
  .icon-btn:active { transform: scale(.92); }
  .top .grow { flex: 1; }
  .chip-btn {
    border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 8px 14px; font-size: 14px; color: var(--muted);
  }
  .chip-btn b { color: var(--text); font-weight: 600; }

  h2 { font-size: 30px; font-weight: 800; margin: 14px 0 4px; letter-spacing: -.02em; }
  .lead { color: var(--muted); margin: 0 0 18px; font-size: 16px; }
  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .center { justify-content: center; }
  .actions { flex: none; display: flex; flex-direction: column; gap: 10px; padding-top: 12px; }

  .btn {
    width: 100%; height: 58px; border: 0; border-radius: 18px;
    font-size: 18px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, var(--a1), #5b8cff 55%, var(--a2));
    box-shadow: 0 12px 30px -12px rgba(124,92,255,.8), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .12s, opacity .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .4; }
  .btn.ghost { background: var(--card); border: 1px solid var(--line); box-shadow: none; color: var(--text); }
  .row-btns { display: flex; gap: 10px; }
  .row-btns .btn { flex: 1; }

  .field {
    width: 100%; height: 58px; border-radius: 16px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font: inherit; font-size: 18px;
    padding: 0 18px; outline: none; transition: border-color .2s, box-shadow .2s;
    user-select: text; -webkit-user-select: text;
  }
  .field::placeholder { color: rgba(165,159,196,.6); }
  .field:focus { border-color: var(--a1); box-shadow: 0 0 0 4px rgba(124,92,255,.22); }

  /* ---------- splash ---------- */
  #splash { align-items: center; text-align: center; }
  #splash .body { align-items: center; justify-content: center; gap: 6px; }
  .hero-die { width: min(58vw, 230px); aspect-ratio: 1; animation: float 4s ease-in-out infinite; filter: drop-shadow(0 18px 40px rgba(124,92,255,.55)); }
  .hero-die svg { width: 100%; height: 100%; display: block; }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-12px) rotate(4deg); } }
  .title {
    font-size: clamp(38px, 11vw, 52px); font-weight: 800; letter-spacing: -.03em; margin: 22px 0 0; line-height: 1;
    background: linear-gradient(135deg, #fff 20%, #b9a8ff 60%, var(--a2)); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .credit { color: var(--muted); font-size: 15px; margin-top: 12px; letter-spacing: .02em; }
  .credit span { color: var(--text); font-weight: 600; }
  #splash .actions { width: 100%; }

  /* ---------- segmented ---------- */
  .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; position: relative; flex: none; }
  .seg button { flex: 1; height: 40px; border: 0; background: none; border-radius: 10px; font-size: 16px; font-weight: 600; color: var(--muted); position: relative; z-index: 1; transition: color .2s; }
  .seg button.on { color: #fff; }
  .seg .thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 10px; background: linear-gradient(135deg, var(--a1), #5b8cff); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  .seg.right .thumb { transform: translateX(100%); }

  /* ---------- wheel ---------- */
  .wheel-wrap { position: relative; flex: 1; min-height: 220px; max-height: 340px; margin: 18px 0 6px; }
  .wheel-band {
    position: absolute; left: 0; right: 0; top: 50%; height: calc(var(--H) + 4px); transform: translateY(-50%);
    border-radius: 16px; background: var(--card-hi); border: 1px solid rgba(124,92,255,.5);
    box-shadow: 0 0 0 4px rgba(124,92,255,.12); pointer-events: none;
  }
  .wheel-unit { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; pointer-events: none; }
  .wheel {
    position: absolute; inset: 0; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none;
    perspective: 700px; overscroll-behavior: contain;
    -webkit-mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent);
            mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent);
  }
  .wheel::-webkit-scrollbar { display: none; }
  .wheel-item {
    height: var(--H); display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 800; scroll-snap-align: center; color: var(--muted);
    font-variant-numeric: tabular-nums; will-change: transform, opacity;
  }
  .wheel-item.sel { color: #fff; }

  /* ---------- names ---------- */
  .list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 2px 2px 8px; margin: 0 -2px; overscroll-behavior: contain; }
  .name-row { display: flex; align-items: center; gap: 10px; animation: rise .35s backwards cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .badge { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 16px; flex: none; color: #fff; }
  .name-row .field { height: 52px; font-size: 17px; }
  .you { position: relative; flex: 1; }
  .you .field { padding-right: 56px; }
  .you .tag { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 600; color: var(--a2); background: rgba(34,211,238,.12); padding: 4px 8px; border-radius: 999px; pointer-events: none; }

  /* ---------- roll ---------- */
  #roll .body { align-items: center; }
  .stage { flex: 1; min-height: 200px; width: 100%; display: grid; place-items: center; position: relative; }
  .die-wrap { position: relative; width: min(66vw, 280px); aspect-ratio: 1; perspective: 900px; cursor: pointer; }
  .die { position: absolute; inset: 0; transform-style: preserve-3d; }
  .die svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 16px 30px rgba(0,0,0,.45)); }
  .die-label {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 46%;
    text-align: center; font-weight: 800; line-height: 1.05; color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,.45); overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .die-label.tri { top: 57%; width: 38%; }
  .shadow { position: absolute; left: 18%; right: 18%; bottom: -8%; height: 10%; border-radius: 50%; background: radial-gradient(rgba(0,0,0,.55), transparent 70%); }
  .die.landed svg { animation: glow 1.6s ease-out; }
  @keyframes glow { 0% { filter: drop-shadow(0 0 0 rgba(255,204,77,0)); } 25% { filter: drop-shadow(0 0 34px rgba(255,204,77,.85)); } 100% { filter: drop-shadow(0 16px 30px rgba(0,0,0,.45)); } }
  .hint { color: var(--muted); font-size: 15px; height: 22px; text-align: center; transition: opacity .2s; }
  .result { width: 100%; text-align: center; min-height: 112px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
  .result .who { font-size: clamp(28px, 9vw, 40px); font-weight: 800; color: var(--gold); letter-spacing: -.02em; line-height: 1.1; overflow-wrap: anywhere; }
  .result .goes { color: var(--muted); font-size: 16px; margin-top: 2px; }
  .result.show > * { animation: pop .5s backwards cubic-bezier(.2,1.4,.4,1); }
  .result.show > *:nth-child(2) { animation-delay: .08s; }
  .result.show > *:nth-child(3) { animation-delay: .16s; }
  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.9); } }
  .order { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 12px; max-height: 84px; overflow-y: auto; }
  .order span { font-size: 13px; padding: 5px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--muted); }
  .order span b { color: var(--text); margin-right: 4px; }
  .order span:first-child { border-color: rgba(255,204,77,.6); color: var(--gold); }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

  @media (max-height: 640px) {
    h2 { font-size: 26px; margin-top: 6px; }
    .lead { margin-bottom: 12px; }
    .die-wrap { width: min(54vw, 220px); }
    .btn { height: 52px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-die { animation: none; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- Splash -->
  <section class="screen" id="splash">
    <div class="body">
      <div class="hero-die" id="heroDie"></div>
      <h1 class="title">The Randomizer</h1>
      <div class="credit">Made for fun by <span>Joey</span></div>
    </div>
    <div class="actions">
      <button class="btn" id="startBtn">Let's Roll</button>
    </div>
  </section>

  <!-- Welcome / your name -->
  <section class="screen" id="welcome">
    <div class="top">
      <button class="icon-btn" data-back aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    </div>
    <div class="body center">
      <h2>What's your name?</h2>
      <p class="lead">You'll be added to every roll automatically.</p>
      <input class="field" id="userInput" type="text" maxlength="24" autocomplete="given-name" autocapitalize="words" enterkeyhint="done" placeholder="Your name">
    </div>
    <div class="actions">
      <button class="btn" id="saveUserBtn" disabled>Continue</button>
    </div>
  </section>

  <!-- How many -->
  <section class="screen" id="count">
    <div class="top">
      <button class="icon-btn" data-back aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="grow"></div>
      <button class="chip-btn" id="editUserBtn">Hi, <b id="userHi"></b> ✎</button>
    </div>
    <div class="body">
      <h2>How many?</h2>
      <p class="lead">Spin the wheel to pick.</p>
      <div class="seg" id="seg">
        <div class="thumb"></div>
        <button data-mode="players">Players</button>
        <button data-mode="teams">Teams</button>
      </div>
      <div class="wheel-wrap">
        <div class="wheel-band"></div>
        <div class="wheel" id="wheel"></div>
        <div class="wheel-unit" id="wheelUnit">players</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="toNamesBtn">Next</button>
    </div>
  </section>

  <!-- Names -->
  <section class="screen" id="names">
    <div class="top">
      <button class="icon-btn" data-back aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    </div>
    <h2 id="namesTitle">Who's playing?</h2>
    <p class="lead">Blank spots keep their default name.</p>
    <div class="list" id="nameList"></div>
    <div class="actions">
      <button class="btn" id="toRollBtn">Roll the die</button>
    </div>
  </section>

  <!-- Roll -->
  <section class="screen" id="roll">
    <div class="top">
      <button class="icon-btn" data-back aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="grow"></div>
      <div class="chip-btn" id="rollInfo" style="pointer-events:none"></div>
    </div>
    <div class="body">
      <div class="stage">
        <div class="die-wrap" id="dieWrap" role="button" aria-label="Roll the die">
          <div class="shadow" id="dieShadow"></div>
          <div class="die" id="die"></div>
        </div>
      </div>
      <div class="hint" id="hint">Tap the die to roll</div>
      <div class="result" id="result" aria-live="polite"></div>
    </div>
    <div class="actions" id="rollActions"></div>
  </section>

</div>
<canvas id="fx"></canvas>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('randomizer.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('randomizer.' + k, JSON.stringify(v)); } catch {} }
  };
  const MIN = 2, MAX = 20;
  const state = {
    user: store.get('user', ''),
    count: Math.min(MAX, Math.max(MIN, store.get('count', 4))),
    mode: store.get('mode', 'players'),
    names: store.get('names', []),
    players: [],
    rolling: false
  };
  const COLORS = ['#7c5cff','#22d3ee','#f472b6','#facc15','#34d399','#fb923c','#60a5fa','#f87171','#a3e635','#c084fc',
                  '#2dd4bf','#fbbf24','#818cf8','#f43f5e','#4ade80','#38bdf8','#e879f9','#fdba74','#94a3b8','#a78bfa'];
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };
  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const unit = () => state.mode === 'teams' ? 'Team' : 'Player';

  // Fair random integer in [0, n)
  function rand(n) {
    const max = Math.floor(0x100000000 / n) * n, buf = new Uint32Array(1);
    do { crypto.getRandomValues(buf); } while (buf[0] >= max);
    return buf[0] % n;
  }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  /* ---------------- dice art ---------------- */
  const HUE = 258;
  const hsl = l => `hsl(${HUE} 72% ${l}%)`;
  function d20SVG(id, number) {
    const T=[100,8], TR=[180,54], BR=[180,146], B=[100,192], BL=[20,146], TL=[20,54];
    const A=[100,44], R=[150,132], L=[50,132];
    const f = (pts, l) => `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="${hsl(l)}"/>`;
    return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${hsl(72)}"/><stop offset="1" stop-color="${hsl(56)}"/></linearGradient></defs>
      <g stroke="rgba(255,255,255,.35)" stroke-width="1.6" stroke-linejoin="round">
        ${f([T,TL,A],54)}${f([T,A,TR],46)}${f([TL,L,A],48)}${f([TR,A,R],38)}
        ${f([TL,BL,L],40)}${f([TR,BR,R],30)}${f([BL,B,L],32)}${f([BR,B,R],24)}${f([L,R,B],36)}
        <polygon points="${[A,R,L].map(p => p.join(',')).join(' ')}" fill="url(#${id}g)"/>
      </g>
      ${number ? `<text x="100" y="110" text-anchor="middle" font-family="Outfit, system-ui, sans-serif" font-weight="800" font-size="34" fill="#fff">20</text>` : ''}
    </svg>`;
  }
  function coinSVG(id) {
    return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs><radialGradient id="${id}c" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="${hsl(72)}"/><stop offset="1" stop-color="${hsl(34)}"/></radialGradient></defs>
      <circle cx="100" cy="100" r="92" fill="url(#${id}c)" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
      <circle cx="100" cy="100" r="74" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="2" stroke-dasharray="4 6"/>
    </svg>`;
  }
  // Faceted gem-style die with n sides
  function polySVG(id, n) {
    const C = 100, R = 92, r = R * (n === 3 ? 0.42 : n <= 5 ? 0.55 : 0.62);
    const off = n === 4 ? -Math.PI / 4 * 3 : -Math.PI / 2;
    const cy = n === 3 ? 112 : 100; // visually center triangles
    const pt = (rad, i) => [C + rad * Math.cos(off + i * 2 * Math.PI / n), cy + rad * Math.sin(off + i * 2 * Math.PI / n)];
    const P = (a) => a.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
    const Lx = -0.45, Ly = -0.89;
    let facets = '';
    for (let i = 0; i < n; i++) {
      const a = off + (i + 0.5) * 2 * Math.PI / n;
      const d = Math.cos(a) * Lx + Math.sin(a) * Ly;
      facets += `<polygon points="${P([pt(R,i), pt(R,i+1), pt(r,i+1), pt(r,i)])}" fill="${hsl(38 + d * 16)}"/>`;
    }
    const inner = Array.from({length: n}, (_, i) => pt(r, i));
    return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${hsl(70)}"/><stop offset="1" stop-color="${hsl(54)}"/></linearGradient></defs>
      <g stroke="rgba(255,255,255,.35)" stroke-width="1.6" stroke-linejoin="round">${facets}
        <polygon points="${P(inner)}" fill="url(#${id}g)"/></g>
    </svg>`;
  }
  const dieSVG = n => n === 20 ? d20SVG('r', false) : n === 2 ? coinSVG('r') : polySVG('r', n);

  $('#heroDie').innerHTML = d20SVG('h', true);

  /* ---------------- navigation ---------------- */
  const order = ['splash', 'welcome', 'count', 'names', 'roll'];
  let current = null;
  function show(id, push = true) {
    if (id === current) return;
    const prev = current && document.getElementById(current);
    const next = document.getElementById(id);
    const forward = !current || order.indexOf(id) > order.indexOf(current);
    if (prev) {
      prev.classList.remove('active');
      prev.classList.toggle('left', forward);
      prev.inert = true;
    }
    next.classList.remove('left');
    if (!forward) { next.style.transition = 'none'; next.classList.add('left'); next.offsetWidth; next.style.transition = ''; next.classList.remove('left'); }
    next.classList.add('active');
    next.inert = false;
    current = id;
    onEnter[id] && onEnter[id]();
    if (push) history.pushState({ s: id }, '');
  }
  document.querySelectorAll('.screen').forEach(s => s.inert = true);
  window.addEventListener('popstate', e => {
    if (state.rolling) { history.pushState({ s: current }, ''); return; }
    show((e.state && e.state.s) || 'splash', false);
  });
  document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => history.back()));

  const onEnter = {
    welcome() {
      const inp = $('#userInput');
      inp.value = state.user;
      $('#saveUserBtn').disabled = !inp.value.trim();
      setTimeout(() => inp.focus(), 350);
    },
    count() {
      $('#userHi').textContent = state.user;
      syncWheel();
    },
    names() { buildNames(); },
    roll() { setupRoll(); }
  };

  /* ---------------- splash ---------------- */
  $('#startBtn').addEventListener('click', () => show(state.user ? 'count' : 'welcome'));

  /* ---------------- welcome ---------------- */
  const userInput = $('#userInput');
  userInput.addEventListener('input', () => { $('#saveUserBtn').disabled = !userInput.value.trim(); });
  userInput.addEventListener('keydown', e => { if (e.key === 'Enter') $('#saveUserBtn').click(); });
  $('#saveUserBtn').addEventListener('click', () => {
    const v = userInput.value.trim();
    if (!v) return;
    const editing = !!state.user;
    state.user = v; store.set('user', v);
    state.names[0] = v; store.set('names', state.names);
    list.innerHTML = '';
    userInput.blur();
    editing ? history.back() : show('count');
  });
  $('#editUserBtn').addEventListener('click', () => show('welcome'));

  /* ---------------- players / teams toggle ---------------- */
  const seg = $('#seg');
  function syncSeg() {
    seg.classList.toggle('right', state.mode === 'teams');
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode === state.mode));
    $('#wheelUnit').textContent = state.mode;
  }
  seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.mode = b.dataset.mode; store.set('mode', state.mode); syncSeg(); buzz(8);
  });
  syncSeg();

  /* ---------------- wheel picker ---------------- */
  const wheel = $('#wheel');
  const itemH = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--H')) || 56;
  const pad = document.createElement('div'), pad2 = document.createElement('div');
  wheel.append(pad);
  const items = [];
  for (let n = MIN; n <= MAX; n++) {
    const it = document.createElement('div');
    it.className = 'wheel-item'; it.textContent = n; it.dataset.n = n;
    wheel.append(it); items.push(it);
  }
  wheel.append(pad2);
  function sizeWheel() {
    const p = (wheel.clientHeight - itemH()) / 2 + 'px';
    pad.style.height = pad2.style.height = p;
  }
  let lastIdx = -1, raf = 0;
  function paintWheel() {
    raf = 0;
    const H = itemH(), pos = wheel.scrollTop / H;
    items.forEach((it, i) => {
      const d = i - pos, ad = Math.min(Math.abs(d), 4);
      it.style.transform = `rotateX(${-d * 20}deg) scale(${1 - ad * 0.07})`;
      it.style.opacity = 1 - ad * 0.22;
    });
    const idx = Math.max(0, Math.min(items.length - 1, Math.round(pos)));
    if (idx !== lastIdx) {
      if (lastIdx >= 0) { items[lastIdx].classList.remove('sel'); if (current === 'count') buzz(4); }
      items[idx].classList.add('sel');
      lastIdx = idx;
      state.count = MIN + idx; store.set('count', state.count);
    }
  }
  wheel.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(paintWheel); }, { passive: true });
  wheel.addEventListener('click', e => {
    const it = e.target.closest('.wheel-item'); if (!it) return;
    wheel.scrollTo({ top: (it.dataset.n - MIN) * itemH(), behavior: 'smooth' });
  });
  function syncWheel() {
    sizeWheel();
    wheel.scrollTop = (state.count - MIN) * itemH();
    paintWheel();
  }
  window.addEventListener('resize', () => { if (current === 'count') syncWheel(); });
  $('#toNamesBtn').addEventListener('click', () => show('names'));

  /* ---------------- names ---------------- */
  const list = $('#nameList');
  function buildNames() {
    const n = state.count;
    $('#namesTitle').textContent = state.mode === 'teams' ? 'Name the teams' : "Who's playing?";
    $('#toRollBtn').textContent = n === 2 ? 'Flip the coin' : `Roll the d${n}`;
    // keep anything already typed on this screen
    const typed = [...list.querySelectorAll('input')].map(i => i.value);
    if (typed.length) state.names = typed.concat(state.names.slice(typed.length));
    list.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const row = document.createElement('div');
      row.className = 'name-row';
      row.style.animationDelay = Math.min(i, 10) * 30 + 'ms';
      const val = i === 0 ? (state.names[0] || state.user) : (state.names[i] || '');
      const input = `<input class="field" type="text" maxlength="24" autocapitalize="words" autocomplete="off"
        enterkeyhint="${i === n - 1 ? 'done' : 'next'}" placeholder="${unit()} ${i + 1}" value="${esc(val)}" data-i="${i}">`;
      row.innerHTML = `<div class="badge" style="background:${COLORS[i]}">${i + 1}</div>` +
        (i === 0 && state.mode === 'players' ? `<div class="you">${input}<span class="tag">YOU</span></div>` : input);
      list.append(row);
    }
  }
  list.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const i = +e.target.dataset.i, next = list.querySelector(`input[data-i="${i + 1}"]`);
    next ? next.focus() : e.target.blur();
  });
  list.addEventListener('input', e => { state.names[+e.target.dataset.i] = e.target.value; });
  $('#toRollBtn').addEventListener('click', () => {
    const inputs = [...list.querySelectorAll('input')];
    state.names = inputs.map(i => i.value.trim());
    store.set('names', state.names);
    state.players = inputs.map((inp, i) => inp.value.trim() || `${unit()} ${i + 1}`);
    document.activeElement && document.activeElement.blur();
    show('roll');
  });

  /* ---------------- roll ---------------- */
  const die = $('#die'), label = document.createElement('div');
  label.className = 'die-label';
  function setLabel(text) {
    label.textContent = text;
    const len = text.length, n = state.players.length;
    let size = len <= 3 ? 38 : len <= 6 ? 30 : len <= 9 ? 24 : len <= 13 ? 19 : 16;
    if (n === 3) size *= 0.8;
    label.style.fontSize = `calc(${size}px * var(--dscale, 1))`;
  }
  function setupRoll() {
    const n = state.players.length;
    die.innerHTML = dieSVG(n);
    die.append(label);
    label.classList.toggle('tri', n === 3);
    die.classList.remove('landed');
    const w = $('#dieWrap').clientWidth;
    die.style.setProperty('--dscale', (w / 280).toFixed(2));
    setLabel(n === 2 ? '?' : `d${n}`);
    $('#rollInfo').innerHTML = `<b>${n === 2 ? 'Coin' : 'd' + n}</b> · ${n} ${state.mode}`;
    $('#hint').style.opacity = 1;
    $('#hint').textContent = n === 2 ? 'Tap the coin to flip' : 'Tap the die to roll';
    $('#result').className = 'result'; $('#result').innerHTML = '';
    renderActions(false);
  }
  function renderActions(done) {
    const a = $('#rollActions');
    const n = state.players.length, verb = n === 2 ? 'Flip' : 'Roll';
    a.innerHTML = done
      ? `<div class="row-btns"><button class="btn ghost" id="editBtn">Edit</button><button class="btn" id="rollBtn">${verb} again</button></div>`
      : `<button class="btn" id="rollBtn">${verb}!</button>`;
    $('#rollBtn').addEventListener('click', roll);
    const eb = $('#editBtn'); if (eb) eb.addEventListener('click', () => history.back());
  }
  $('#dieWrap').addEventListener('click', roll);

  function roll() {
    if (state.rolling) return;
    state.rolling = true;
    const P = state.players, n = P.length;
    const win = rand(n);
    const res = $('#result');
    res.className = 'result'; res.innerHTML = '';
    $('#hint').style.opacity = 0;
    die.classList.remove('landed');
    $('#rollBtn').disabled = true;
    const eb = $('#editBtn'); if (eb) eb.disabled = true;
    buzz(15);

    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const DUR = reduce ? 900 : 2600;
    const spins = 3 + rand(2), sx = (rand(2) ? 1 : -1), coin = n === 2;
    const kf = coin ? [
      { transform: 'translateY(0) rotateY(0deg) scale(1)' },
      { transform: 'translateY(-42%) rotateY(900deg) scale(.9)', offset: .4 },
      { transform: 'translateY(0) rotateY(1620deg) scale(1)', offset: .8 },
      { transform: 'translateY(-4%) rotateY(1800deg) scale(1)', offset: .9 },
      { transform: 'translateY(0) rotateY(1800deg) scale(1)' }
    ] : [
      { transform: 'translateY(0) rotateX(0) rotateY(0) rotateZ(0) scale(1)' },
      { transform: `translateY(-26%) rotateX(${sx*40}deg) rotateY(-30deg) rotateZ(${sx*spins*120}deg) scale(.82)`, offset: .25 },
      { transform: `translateY(0) rotateX(${sx*-25}deg) rotateY(25deg) rotateZ(${sx*spins*250}deg) scale(.9)`, offset: .52 },
      { transform: `translateY(-9%) rotateX(${sx*14}deg) rotateY(-10deg) rotateZ(${sx*spins*330}deg) scale(.96)`, offset: .72 },
      { transform: `translateY(0) rotateX(0) rotateY(0) rotateZ(${sx*spins*360}deg) scale(1.04)`, offset: .9 },
      { transform: `translateY(0) rotateX(0) rotateY(0) rotateZ(${sx*spins*360}deg) scale(1)` }
    ];
    const anim = die.animate(kf, { duration: DUR, easing: 'cubic-bezier(.25,.7,.3,1)' });
    $('#dieShadow').animate([
      { transform: 'scale(1)', opacity: 1 },
      { transform: 'scale(.6)', opacity: .4, offset: .25 },
      { transform: 'scale(1)', opacity: 1, offset: .52 },
      { transform: 'scale(.85)', opacity: .8, offset: .72 },
      { transform: 'scale(1)', opacity: 1 }
    ], { duration: DUR, easing: 'cubic-bezier(.25,.7,.3,1)' });

    // flicker through names, slowing down
    const t0 = performance.now();
    let shown = -1;
    (function tick() {
      const t = (performance.now() - t0) / DUR;
      if (t >= 0.86) return;
      let j; do { j = rand(n); } while (n > 1 && j === shown);
      shown = j; setLabel(P[j]);
      setTimeout(tick, 45 + 260 * t * t * t);
    })();

    anim.onfinish = () => {
      setLabel(P[win]);
      die.classList.add('landed');
      buzz([30, 40, 60]);
      const rest = shuffle(P.map((_, i) => i).filter(i => i !== win));
      const ord = [win, ...rest];
      res.innerHTML = `<div class="who">${esc(P[win])}</div>
        <div class="goes">${n === 2 ? 'wins the toss and goes first!' : 'goes first!'}</div>
        ${n > 2 ? `<div class="order">${ord.map((i, k) => `<span><b>${k + 1}</b>${esc(P[i])}</span>`).join('')}</div>` : ''}`;
      res.classList.add('show');
      confetti();
      renderActions(true);
      state.rolling = false;
    };
  }

  /* ---------------- confetti ---------------- */
  const fx = $('#fx'), ctx = fx.getContext('2d');
  function confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    fx.width = innerWidth * dpr; fx.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const r = $('#dieWrap').getBoundingClientRect();
    const ox = r.left + r.width / 2, oy = r.top + r.height / 2;
    const cols = ['#ffcc4d', '#7c5cff', '#22d3ee', '#f472b6', '#ffffff', '#34d399'];
    const parts = Array.from({ length: 140 }, () => {
      const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 9;
      return { x: ox, y: oy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6, w: 5 + Math.random() * 6, h: 3 + Math.random() * 4,
        c: cols[Math.random() * cols.length | 0], rot: Math.random() * 6, vr: (Math.random() - .5) * .4 };
    });
    const start = performance.now();
    (function frame(now) {
      const t = now - start;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ctx.globalAlpha = Math.max(0, 1 - Math.max(0, t - 1200) / 800);
      for (const p of parts) {
        p.vx *= .985; p.vy = p.vy * .985 + .32; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      }
      if (t < 2000) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
    })(start);
  }

  /* ---------------- boot ---------------- */
  history.replaceState({ s: 'splash' }, '');
  show('splash', false);
})();
</script>
</body>
</html>
